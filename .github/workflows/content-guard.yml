name: content-guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for employer-specific or PHI-shaped content
        env:
          CONTENT_GUARD_EXTRA: ${{ secrets.CONTENT_GUARD_EXTRA }}
        run: bash scripts/content-guard.sh
